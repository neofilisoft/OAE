[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repro-engine"
version = "0.1.0"
description = "A Python-first digital lineage, genetics, identity, AI, and simulation engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8",
  "numpy>=1.26",
  "networkx>=3.0",
  "scikit-learn>=1.4",
  "pandas>=2.0"
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["repro_engine*"]
